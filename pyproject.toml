[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claude-memory"
version = "2.0.0"
description = "Local long-term memory for Claude Code via MCP - hybrid BM25 + vector search, fully local"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "mcp>=0.9.0",
    "httpx>=0.27.0",
    "sqlite-vec>=0.1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[project.scripts]
claude-memory = "claude_memory.server.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_memory"]
