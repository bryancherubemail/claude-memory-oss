[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claude-memory"
version = "2.1.0"
description = "Local-first persistent memory for Claude Code — hybrid search, knowledge graph, zero cloud dependencies"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Bryan Anaya", email = "bryan@cherub.solutions" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mcp>=0.9.0",
    "httpx>=0.27.0",
    "sqlite-vec>=0.1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[project.scripts]
claude-memory = "claude_memory.server.main:main"

[project.urls]
Homepage = "https://github.com/bryancherubemail/claude-memory-oss"
Repository = "https://github.com/bryancherubemail/claude-memory-oss"
Issues = "https://github.com/bryancherubemail/claude-memory-oss/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_memory"]
